name: auto-merge-submissions

# 无人值守收录（方案3）：作者用启动器「提交审核」开的 PR（register/** 与 release/**）
# 在这里按收录规范自动校验，通过就自动合并，并立刻触发 build-index 重建 —— 全程不需要
# 维护者开电脑、也不需要有人点合并。
#
# 几条关键设计（都有实测用例兜着，见仓库 README）：
#   · 用 pull_request_target：workflow 永远取自 base 分支，且能拿到写权限；全程只用
#     GitHub API 读 PR 里的**数据**，绝不 checkout / 执行 PR 的代码 —— 来自 fork 的
#     提交因此没有任何机会把代码跑进这个 workflow。
#   · 只放行 sources.json 与 mods/<id>.json 两类文件：挡住改 workflow / scripts / docs
#     的 PR（否则等于把自动合并变成任意代码执行的入口）。
#   · 新增来源必须是 PR 作者自己的仓库（owner == PR 作者），挡住"把别人的仓库登记成自己的"。
#   · sources.json 只允许新增，不允许删掉 main 上已有的来源。
#   · 判定按「三方合并后 main 实际会变成什么样」，不是字面 diff：作者分支常常落后 main
#     很多，字面比较会把 main 早就删掉/早就加上的来源误算成本 PR 的动作而误拦。
#   · 合并后显式 dispatch build-index：GITHUB_TOKEN 产生的 push 事件不会触发其它
#     workflow（GitHub 的防递归规则），不点名就得等 6 小时的定时任务兜底。
#   · 内容层面的合法性（sha256 / 公钥绑定 / id 先到先得等）仍然由 build-index.mjs 把关，
#     不合格的条目会照旧被跳过并在日志里列出，不会上架。
#
# 总开关：仓库 Settings → Secrets and variables → Actions → Variables
#   加一个 AUTO_MERGE_SUBMISSIONS=off  → 只校验 + 留言，不自动合并（回到人工流程）
#
# 手动补跑：Actions → auto-merge-submissions → Run workflow → 填 PR 编号
#   （dry_run 填 true 可以只校验不合并）

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # 外部程序触发的入口：只要 Contents 写权限就能点名跑某条 PR（无需 Actions 权限），
  # 便于把「检查某条提交」接进别的自动化里。
  repository_dispatch:
    types: [auto-merge-check]
  workflow_dispatch:
    inputs:
      pr:
        description: "要检查的 PR 编号"
        required: true
      dry_run:
        description: "只校验不合并（true / false）"
        required: false
        default: "false"

permissions:
  contents: write        # 合并 PR
  pull-requests: write   # 写评论
  actions: write         # 点名触发 build-index

# 同一条 PR 串行跑：启动器会连续 push 好几次，别让两次校验互相踩
concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr || github.event.client_payload.pr }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 解析 PR 编号
        id: pr
        run: |
          # 三个入口：pull_request_target（作者提交时自动跑）/ workflow_dispatch（网页手动）/
          # repository_dispatch（外部程序点名，只要 Contents 写权限即可触发）
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.pr }}" ]; then
            echo "number=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.client_payload.pr }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 按收录规范校验，通过则自动合并
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_SUBMISSIONS }}
          DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run }}
        run: |
          cat > "$RUNNER_TEMP/auto-merge.mjs" <<'JSEOF'

          const TOKEN = process.env.GITHUB_TOKEN
          const REPO = process.env.REPO
          const PR_NUMBER = process.env.PR
          const AUTOMERGE = String(process.env.AUTO_MERGE || "on").trim().toLowerCase() !== "off"
          const MAINTAINERS = String(process.env.MAINTAINERS || "diguo520").split(",")
            .map(function (s) { return s.trim().toLowerCase() })
            .filter(Boolean)
          const DRY = /^(1|true|yes|on)$/i.test(String(process.env.DRY_RUN || "").trim())

          const API = "https://api.github.com"
          const ALLOWED_FILE = /^(sources\.json|mods\/[A-Za-z0-9._-]{1,100}\.json)$/
          const SUBMIT_BRANCH = /^(register|release)\//
          const SOURCE_RE = /^[A-Za-z0-9._-]{1,100}\/[A-Za-z0-9._-]{1,100}$/

          const H = {
            Authorization: "Bearer " + TOKEN,
            "User-Agent": "auto-merge-submissions",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          function api(path, opts) {
            const o = opts || {}
            const headers = Object.assign({}, H, o.headers || {})
            return fetch(API + path, { method: o.method || "GET", headers: headers, body: o.body })
              .then(function (res) {
                return res.text().then(function (text) {
                  let json = null
                  try { json = text ? JSON.parse(text) : null } catch (e) { json = null }
                  return { status: res.status, ok: res.ok, json: json, text: text }
                })
              })
          }

          function readSources(doc) {
            const arr = doc && Array.isArray(doc.sources) ? doc.sources : []
            return arr.filter(function (x) { return typeof x === "string" })
              .map(function (x) { return x.trim() })
              .filter(Boolean)
          }

          const fail = []
          const note = []
          const MARKER = "<!-- auto-merge-submissions -->"

          // 给作者留一条「粘性」评论：同一个标记只保留一条，后续用 PATCH 覆盖，
          // 避免启动器每次刷新同一条 PR 都刷出一堆评论。
          async function upsertComment(body) {
            const full = MARKER + "\n\n" + body
            try {
              const list = await api("/repos/" + REPO + "/issues/" + PR_NUMBER + "/comments?per_page=100")
              if (list.ok && Array.isArray(list.json)) {
                const mine = list.json.filter(function (c) { return c && typeof c.body === "string" && c.body.indexOf(MARKER) >= 0 })
                if (mine.length) {
                  await api("/repos/" + REPO + "/issues/comments/" + mine[0].id, {
                    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body: full }),
                  })
                  return
                }
              }
              await api("/repos/" + REPO + "/issues/" + PR_NUMBER + "/comments", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ body: full }),
              })
            } catch (e) {
              console.log("::warning::写 PR 评论失败（不影响流程）：" + e)
            }
          }

          function evaluate(pr, files, baseList, headList, mainList, author) {
            const baseSet = {}
            baseList.forEach(function (s) { baseSet[s.toLowerCase()] = 1 })
            const headSet = {}
            headList.forEach(function (s) { headSet[s.toLowerCase()] = 1 })
            const mainSet = {}
            mainList.forEach(function (s) { mainSet[s.toLowerCase()] = 1 })

            if (pr.state !== "open") fail.push("PR 不是 open 状态（" + pr.state + "）")
            if (pr.draft) fail.push("PR 还是草稿（draft）")
            if (!pr.base || pr.base.ref !== "main") fail.push("目标分支不是 main")
            if (!SUBMIT_BRANCH.test(pr.head.ref)) fail.push("分支名不是 register/** 或 release/**（实际：" + pr.head.ref + "）")
            if (!pr.head.repo) fail.push("读不到 head 仓库（fork 可能已被删除）")
            if (files.length === 0) fail.push("PR 没有任何改动文件")
            if (files.length > 50) fail.push("改动文件过多（" + files.length + " 个）")

            const bad = files.filter(function (f) { return !ALLOWED_FILE.test(String(f.filename || "")) })
            if (bad.length) {
              fail.push("改动了不允许的文件：" + bad.map(function (f) { return f.filename }).join(", "))
            }

            // 判定口径按「合并后 main 实际会变成什么样」，不是「head 与某个提交的字面差异」：
            // 这两个 PR 的分支都比 main 落后很多，字面比较会把 main 早就删掉的来源、
            // main 早就加上的来源全都算成这个 PR 的动作，从而误拦。
            //  · removed：在 main 上有、在这条分支的谱系里也有，却被这个 PR 改没了
            //    （main 自己删掉的不算 —— 三方合并里它保持删除，不是这个 PR 的锅）
            //  · added：相对 merge-base 和 main 都是新的，即合并后真正会新增到 main 上的
            const removed = mainList.filter(function (s) { return baseSet[s.toLowerCase()] && !headSet[s.toLowerCase()] })
            if (removed.length) fail.push("sources.json 里删掉了已有来源（不允许）：" + removed.join(", "))
            const added = headList.filter(function (s) { return !baseSet[s.toLowerCase()] && !mainSet[s.toLowerCase()] })

            return { added: added, removed: removed, isMaintainer: MAINTAINERS.indexOf(author) >= 0 }
          }

          /**
           * 分支与 main 撞车时的兜底：对 fork 分支我们没有写权限（update-branch 会 403），
           * 让作者自己解冲突等于把「无人值守」废掉，所以把「合并后 main 该有的样子」直接提交上去：
           * sources.json 用 main 现有清单并上本 PR 新增的来源（只增不删、main 的顺序在前），
           * 再把本 PR 的 mods/*.json 原样放上去。全程只写这里已经校验过的两类文件。
           * main 在这期间被别的东西推进了就重读一次再试，失败把状态码如实带回去。
           */
          async function replayOnMain(added, modTexts, mainDoc, touchesSources) {
            const paths = Object.keys(modTexts || {})
            for (let attempt = 0; attempt < 2; attempt += 1) {
              const ref = await api("/repos/" + REPO + "/git/ref/heads/main")
              if (!ref.ok) return { ok: false, status: ref.status }
              const headCommit = await api("/repos/" + REPO + "/git/commits/" + ref.json.object.sha)
              if (!headCommit.ok) return { ok: false, status: headCommit.status }
              const baseTree = headCommit.json.tree.sha
              const tree = []

              if (touchesSources) {
                const current = readSources(mainDoc)
                const seen = {}
                current.forEach(function (s) { seen[s.toLowerCase()] = 1 })
                const union = current.slice()
                added.forEach(function (s) { if (!seen[s.toLowerCase()]) { seen[s.toLowerCase()] = 1; union.push(s) } })
                const text = JSON.stringify(Object.assign({}, mainDoc, { sources: union }), null, 2) + "\n"
                const blob = await api("/repos/" + REPO + "/git/blobs", {
                  method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: text, encoding: "utf-8" }),
                })
                if (!blob.ok) return { ok: false, status: blob.status }
                tree.push({ path: "sources.json", mode: "100644", type: "blob", sha: blob.json.sha })
              }

              for (let i = 0; i < paths.length; i += 1) {
                const p = paths[i]
                const raw = String(modTexts[p] || "")
                const text = raw.slice(-1) === "\n" ? raw : raw + "\n"
                const blob = await api("/repos/" + REPO + "/git/blobs", {
                  method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: text, encoding: "utf-8" }),
                })
                if (!blob.ok) return { ok: false, status: blob.status }
                tree.push({ path: p, mode: "100644", type: "blob", sha: blob.json.sha })
              }

              if (!tree.length) return { ok: true, already: true, sha: "" }

              const newTree = await api("/repos/" + REPO + "/git/trees", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ base_tree: baseTree, tree: tree }),
              })
              if (!newTree.ok) return { ok: false, status: newTree.status }
              // 内容和 main 一模一样（典型的「重跑一条已经收录过的 PR」）→ 不用再生成空提交
              if (newTree.json.sha === baseTree) return { ok: true, already: true, sha: "" }

              const commit = await api("/repos/" + REPO + "/git/commits", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  message: "chore(index): 自动收录 " + (added.length ? added.join(", ") : paths.join(", ")) + "（PR #" + PR_NUMBER + "）\n\n由 auto-merge-submissions 在分支与 main 撞车时按 main 现状重放生成。",
                  tree: newTree.json.sha,
                  parents: [headCommit.json.sha],
                }),
              })
              if (!commit.ok) return { ok: false, status: commit.status }
              const upd = await api("/repos/" + REPO + "/git/refs/heads/main", {
                method: "PATCH", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sha: commit.json.sha, force: false }),
              })
              if (upd.ok) return { ok: true, sha: commit.json.sha }
              // 409/422 一般是这几秒里 main 又被人推进了，重读一次再来
              if (upd.status !== 409 && upd.status !== 422) return { ok: false, status: upd.status }
            }
            return { ok: false, status: 409 }
          }

          async function main() {
            const prRes = await api("/repos/" + REPO + "/pulls/" + PR_NUMBER)
            if (!prRes.ok) {
              console.log("::error::读不到 PR #" + PR_NUMBER + "（HTTP " + prRes.status + "）")
              process.exit(1)
            }
            const pr = prRes.json
            const author = String((pr.user && pr.user.login) || "").toLowerCase()
            const headRepo = String((pr.head && pr.head.repo && pr.head.repo.full_name) || "")
            const headRef = String((pr.head && pr.head.ref) || "")

            const files = []
            for (let page = 1; page <= 10; page += 1) {
              const r = await api("/repos/" + REPO + "/pulls/" + PR_NUMBER + "/files?per_page=100&page=" + page)
              if (!r.ok) { fail.push("读不到改动文件列表（HTTP " + r.status + "）"); break }
              const batch = Array.isArray(r.json) ? r.json : []
              for (let i = 0; i < batch.length; i += 1) files.push(batch[i])
              if (batch.length < 100) break
            }

            // 比对基准必须是 merge-base，不是 main 的最新提交：
            // 分支落后于 main 时，main 后来删掉的来源会出现在 head 里，用 main 当基准会把
            // 「别人删的」误判成「本 PR 新增的」。用 merge-base 才和 git 合并的真实语义一致。
            let baseSha = String((pr.base && pr.base.sha) || "main")
            const cmp = await api("/repos/" + REPO + "/compare/" + baseSha + "..." + pr.head.sha)
            if (cmp.ok && cmp.json && cmp.json.merge_base_commit && cmp.json.merge_base_commit.sha) {
              baseSha = cmp.json.merge_base_commit.sha
            } else {
              note.push("读不到 merge-base，退回用 base 分支比对（可能产生误判）")
            }
            const baseS = await api("/repos/" + REPO + "/contents/sources.json?ref=" + baseSha, { headers: { Accept: "application/vnd.github.raw" } })
            const baseM = await api("/repos/" + REPO + "/contents/sources.json?ref=main", { headers: { Accept: "application/vnd.github.raw" } })
            const baseList = readSources(baseS.json)
            if (baseS.status !== 200) fail.push("读不到基准提交的 sources.json（HTTP " + baseS.status + "）")
            else if (baseList.length === 0) fail.push("基准提交的 sources.json 解析不出任何来源")

            const touchesSources = files.some(function (f) { return String(f.filename) === "sources.json" })
            let headList = baseList
            if (touchesSources && headRepo) {
              const r = await api("/repos/" + headRepo + "/contents/sources.json?ref=" + encodeURIComponent(headRef), { headers: { Accept: "application/vnd.github.raw" } })
              if (r.status !== 200) fail.push("读不到 head 的 sources.json（HTTP " + r.status + "）")
              else {
                const parsed = readSources(r.json)
                if (parsed.length === 0) fail.push("head 的 sources.json 解析不出任何来源")
                else headList = parsed
              }
            }

            const mainDoc = baseM.json
            const mainList = readSources(mainDoc)
            if (baseM.status !== 200) fail.push("读不到 main 的 sources.json（HTTP " + baseM.status + "）")
            const verdict = evaluate(pr, files, baseList, headList, mainList, author)


            for (let i = 0; i < verdict.added.length; i += 1) {
              const s = verdict.added[i]
              if (!SOURCE_RE.test(s)) { fail.push("新增来源格式不合法：" + s); continue }
              const owner = s.split("/")[0].toLowerCase()
              if (owner !== author && !verdict.isMaintainer) {
                fail.push("新增来源「" + s + "」的 owner 不是 PR 作者（@" + author + "），拒绝自动合并")
                continue
              }
              const alive = await api("/repos/" + s)
              if (alive.status !== 200) fail.push("来源仓库不可访问：" + s + "（HTTP " + alive.status + "）")
              else note.push("新增来源可用：" + s)
            }

            // 版本记录允许引用「合并后 sources.json 里有的来源」，所以是 head ∪ main 的并集
            const headSet = {}
            headList.forEach(function (s) { headSet[s.toLowerCase()] = 1 })
            mainList.forEach(function (s) { headSet[s.toLowerCase()] = 1 })
            const modFiles = files.map(function (f) { return String(f.filename || "") })
              .filter(function (n) { return n.indexOf("mods/") === 0 })
            const modTexts = {}

            for (let i = 0; i < modFiles.length; i += 1) {
              const p = modFiles[i]
              const r = await api("/repos/" + headRepo + "/contents/" + p + "?ref=" + encodeURIComponent(headRef), { headers: { Accept: "application/vnd.github.raw" } })
              if (r.status !== 200) { fail.push("读不到 " + p + "（HTTP " + r.status + "）"); continue }
              const rec = r.json
              if (!rec || typeof rec !== "object" || Array.isArray(rec)) { fail.push(p + " 不是 JSON 对象"); continue }
              modTexts[p] = String(r.text || "")
              const id = String(rec.id || "").trim()
              const wantId = p.slice(5, p.length - 5)
              if (!id) fail.push(p + " 缺 id")
              else if (id !== wantId) fail.push(p + " 的 id「" + id + "」与文件名不一致")
              const src = String(rec.source || "").trim()
              if (!src) fail.push(p + " 缺 source")
              else {
                if (!headSet[src.toLowerCase()]) fail.push(p + " 的 source「" + src + "」不在 sources.json 里")
                const owner = src.split("/")[0].toLowerCase()
                if (owner !== author && !verdict.isMaintainer) fail.push(p + " 的 source「" + src + "」不属于 PR 作者（@" + author + "）")
              }
              if (Array.isArray(rec.downloadUrls)) {
                const okUrl = rec.downloadUrls.some(function (u) { return u && typeof u.url === "string" && u.url.indexOf("https://") === 0 })
                if (!okUrl) fail.push(p + " 的 downloadUrls 里没有 https 直链")
              }
            }

            const summary = { pr: pr.number, title: pr.title, author: author, head: headRepo + "@" + headRef, files: files.map(function (f) { return f.filename }), added: verdict.added, removed: verdict.removed, merged: false, reasons: fail }
            console.log("verdict " + JSON.stringify(summary))

            // 重新提交提示：这条 PR 重新登记的来源 / 模组 id 如果此前已被驳回或下架，
            // 索引重建后控制台会把它标成「重新提交」进复审队列。提前跟作者说清楚，
            // 免得作者以为重新提交一下就会自动上架。
            const reHits = []
            try {
              const modRes = await api("/repos/" + REPO + "/contents/moderation.json?ref=main", { headers: { Accept: "application/vnd.github.raw" } })
              const modEntries = modRes.json && Array.isArray(modRes.json.entries) ? modRes.json.entries : []
              const ruleMap = {}
              modEntries.forEach(function (e) {
                if (e && typeof e.target === "string") ruleMap[e.target.trim().toLowerCase()] = e
              })
              const seen = {}
              const checkRule = function (key, label) {
                const text = key ? String(key).trim() : ""
                if (!text || seen[text.toLowerCase()]) return
                const hit = ruleMap[text.toLowerCase()]
                if (!hit || (hit.action !== "reject" && hit.action !== "delist")) return
                seen[text.toLowerCase()] = 1
                reHits.push(label + "「" + text + "」此前已" + (hit.action === "delist" ? "下架" : "被驳回") +
                  (hit.reason && hit.reason.zh ? "（" + hit.reason.zh + "）" : "") +
                  (hit.permanent === true ? "，且已永久除名" : ""))
              }
              verdict.added.forEach(function (s) { checkRule(s, "来源") })
              Object.keys(modTexts).forEach(function (p) {
                try {
                  const rec = JSON.parse(modTexts[p] || "{}")
                  checkRule(rec.id, "模组")
                  checkRule(rec.source, "来源")
                } catch (e) { /* 文本不合法时上面已经拦下了 */ }
              })
            } catch (e) {
              console.log("::warning::读 moderation.json 失败（不影响收录）：" + e)
            }

            if (fail.length) {
              console.log("::warning::自动合并被拦下：" + fail.join(" ｜ "))
              await upsertComment(
                "**未通过自动校验，本次没有自动合并。** / Auto-merge was blocked.\n\n" +
                fail.map(function (r) { return "- " + r }).join("\n") +
                "\n\n修正后推送新提交会重新校验；维护者也可以手动检查并合并。",
              )
              return summary
            }
            if (!AUTOMERGE) { console.log("::notice::总开关 AUTO_MERGE_SUBMISSIONS=off，只校验不合并"); return summary }
            if (DRY) { console.log("::notice::DRY_RUN=1，跳过合并"); summary.merged = "dry"; return summary }

            // 正常合并优先：能合上就保留 PR 的 merged 标记，作者在 GitHub 上也有个正式的交待
            const squash = { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ merge_method: "squash" }) }
            let merge = await api("/repos/" + REPO + "/pulls/" + PR_NUMBER + "/merge", squash)
            let replayed = null

            if (!merge.ok) {
              // 合并失败的常见原因就是 sources.json 撞车：它是所有人共用的一份清单，两条 PR 只要改到
              // 同一段就会冲突。而对 fork 分支我们没有写权限（update-branch 会 403），把冲突甩给作者
              // 去解就等于把「无人值守」废掉 —— 所以改成「按 main 现状重放」，见 replayOnMain 的注释。
              console.log("::notice::直接合并失败（HTTP " + merge.status + "：" + ((merge.json && merge.json.message) || "") + "），改按 main 现状重放")
              replayed = await replayOnMain(verdict.added, modTexts, mainDoc, touchesSources)
              if (!replayed.ok) {
                fail.push("自动合并失败（HTTP " + merge.status + "：" + ((merge.json && merge.json.message) || "") + "），按 main 现状重放也没成功（HTTP " + replayed.status + "）")
              }
            }
            if (fail.length) {
              // 关键：失败一定要留下痕迹。之前这里直接 return 不留言，作者和站长都看不到原因。
              console.log("::warning::收录失败：" + fail.join(" ｜ "))
              await upsertComment(
                "**自动收录失败，这条 PR 需要维护者看一眼。** / Auto-merge failed, a maintainer should take a look.\n\n" +
                fail.map(function (r) { return "- " + r }).join("\n") +
                "\n\n推送新提交、或等下一轮巡检，会自动重试。",
              )
              return summary
            }

            if (replayed) {
              // 重放完就把 PR 关掉（内容已经进 main 了），否则它会一直挂在队列里被反复巡检
              await api("/repos/" + REPO + "/pulls/" + PR_NUMBER, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ state: "closed" }),
              })
            }

            const disp = await api("/repos/" + REPO + "/actions/workflows/build-index.yml/dispatches", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ref: "main" }),
            })
            if (disp.status !== 204) console.log("::warning::触发 build-index 失败（HTTP " + disp.status + "），6 小时兜底会补上")

            summary.merged = replayed ? "replayed" : true
            if (replayed && replayed.sha) summary.commit = replayed.sha
            const done = []
            if (verdict.added.length) done.push("- 新增来源 / new source: " + verdict.added.join(", "))
            if (modFiles.length) done.push("- 版本记录 / version record: " + modFiles.join(", "))
            await upsertComment(
              (replayed
                ? "**已通过自动校验并自动收录**：这条分支和 main 的 sources.json 撞车了，已按 main 的最新清单重新生成提交，所以 PR 显示为已关闭（内容已经在索引仓库里，不用再手动处理）。**索引正在重建，约 1 分钟生效。** / Auto-validated and applied. The branch conflicted with sources.json, so the change was replayed on top of the current main and this PR was closed. Index rebuilding (live in ~1 min)."
                : "**已通过自动校验并自动合并，索引正在重建（约 1 分钟生效）。** / Auto-validated, merged, index rebuilding (live in ~1 min).") +
              (done.length ? "\n\n" + done.join("\n") : "") +
              (reHits.length
                ? "\n\n**注意：这条提交涉及此前已被驳回 / 已下架的模组，索引重建后它会进入维护者的「重新提交」复审队列，不会直接上架。** 属于自动检查可复核理由的（比如清单缺字段、包体不在 Release），维护者开启无人值守时会自动复审；其余需要人工确认。 / Note: this submission touches a previously rejected or delisted mod. After the index rebuild it enters the maintainer's re-review queue instead of being published right away." +
                  "\n\n" + reHits.map(function (r) { return "- " + r }).join("\n")
                : ""),
            )
            console.log("verdict-final " + JSON.stringify(summary))
            return summary
          }

          await main()

          JSEOF
          node "$RUNNER_TEMP/auto-merge.mjs"
