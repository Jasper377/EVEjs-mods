name: build-index

# 每 6 小时自动跑一次；push 这些文件时也跑；也可以在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # mods/**：合并一条版本记录（审核 PR）后立刻重建，不用等下一个 6 小时的定时任务
    paths: [sources.json, moderation.json, mods/**, scripts/**, .github/workflows/build-index.yml]

permissions:
  contents: write

# 同一个 workflow 串行跑：定时任务和 push 触发几乎同时开跑时，两个都会往 main 提交索引，
# 后一个 push 会被拒（2026-09-28 实测红过一次）。这里让它们排队，别互相踩。
concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check signing secret is configured
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY || vars.INDEX_SIGNING_KEY }}
        run: |
          # 只打印长度，绝不打印内容 —— 用来区分「没配」「配到别的仓库」「配成了 Variable」
          echo "INDEX_SIGNING_KEY length = ${#INDEX_SIGNING_KEY}"
          if [ -z "$INDEX_SIGNING_KEY" ]; then
            echo "::error::本仓库没有读到 INDEX_SIGNING_KEY。请逐条检查："
            echo "  1) 是不是加到了别的仓库？（必须在 EVEjs-mods 这个仓库里）"
            echo "  2) 加的是 Secret 还是 Variable？必须是 Settings → Secrets and variables → **Actions** → Secrets"
            echo "  3) 名字必须完全一致：INDEX_SIGNING_KEY（区分大小写，前后不要有空格）"
            echo "  4) 如果你加 secret 之前就跑了这次 workflow，加完要重新跑（加 secret 不会自动重跑）"
            echo ""
            echo "不想配 secret 也有兜底：本机跑一次下面这行，然后提交 docs/mod-index.json 即可"
            echo "  INDEX_SIGNING_KEY=\"\$(cat .keys/index.key)\" node scripts/build-index.mjs"
            # 没配 secret 不报错：维护者可以用本机「审核台」直接签名并推送，
            # 这一跑只是没启用的自动重建，标警告并跳过即可，避免每次 push 都红叉。
            echo "::warning::未配置 INDEX_SIGNING_KEY，本次跳过自动重建（索引由本机审核台签名）"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::notice::已读到签名私钥（长度 ${#INDEX_SIGNING_KEY}）"
        # 定时任务在没配密钥时「静默跳过」，避免一天 4 次红叉；手动/推送触发才报错提醒

      - name: Build and sign mod-index.json
        if: env.SKIP_BUILD != '1'
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY || vars.INDEX_SIGNING_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 读 Release 资产下载次数（匿名限 60/h）
        run: node scripts/build-index.mjs

      - name: Commit regenerated index back to main
        if: env.SKIP_BUILD != '1'
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY || vars.INDEX_SIGNING_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # sources.json 也一起提交：build-index.mjs 会把重复 / 大小写重复的来源归一化后写回它
          # （作者重试、分支落后都可能写进重复行），这一步顺带把清单洗干净。
          git add docs/mod-index.json author-keys.json sources.json
          if [ -z "$(git status --porcelain docs/mod-index.json author-keys.json sources.json)" ]; then
            echo "索引没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(index): refresh mod-index.json"
          # docs/mod-index.json 是**生成物**：推被拒时绝不能 rebase —— 两边都是重新生成的整份文件，
          # 冲突是必然的（2026-10-01 实测：一次投稿触发的重建和一次审核结论触发的重建撞在一起，
          # rebase 直接 conflict，两次重建全部红叉，索引停在旧结论上）。
          # 正确做法是丢掉本地这次生成、对齐最新 main 后**重新生成一遍**。
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 被拒（第 $attempt 次），对齐最新 main 后重新生成索引"
            git fetch origin main
            git reset --hard FETCH_HEAD
            node scripts/build-index.mjs
            git add docs/mod-index.json author-keys.json sources.json
            if [ -z "$(git status --porcelain docs/mod-index.json author-keys.json sources.json)" ]; then
              echo "对齐最新 main 后索引已经是最新，无需再提交"
              exit 0
            fi
            git commit -m "chore(index): refresh mod-index.json"
          done
          git push
